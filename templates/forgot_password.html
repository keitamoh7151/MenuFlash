{% extends "base.html" %}
{% block title %}Mot de passe oublié — MenuFlash Mini{% endblock %}
{% block content %}
<div class="mf-auth-bg">
  <div class="card mf-auth-card p-2">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-key-fill" style="font-size: 1.8rem; color: var(--mf-accent);"></i>
        <h1 class="h5 fw-bold mt-2 mb-1" style="color: var(--mf-ink);">Mot de passe oublié</h1>
        <p class="text-secondary small mb-0">Entrez votre email, nous vous enverrons un lien de réinitialisation.</p>
      </div>
      <form method="post" data-mf-guard>
        {% include "_form_guard.html" %}
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Adresse email</label>
          <input type="email" class="form-control" id="email" name="email" maxlength="120"
                 autocomplete="email" autocapitalize="off" spellcheck="false" inputmode="email"
                 placeholder="vous@restaurant.com" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Envoyer le lien de réinitialisation</button>
      </form>
      <p class="text-center text-secondary small mt-3 mb-0">
        <a href="{{ url_for('admin_login') }}"><i class="bi bi-arrow-left me-1"></i>Retour à la connexion</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
