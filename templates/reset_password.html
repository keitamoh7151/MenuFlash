{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe — MenuFlash Mini{% endblock %}
{% block content %}
<div class="mf-auth-bg">
  <div class="card mf-auth-card p-2">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill" style="font-size: 1.8rem; color: var(--mf-accent);"></i>
        <h1 class="h5 fw-bold mt-2 mb-1" style="color: var(--mf-ink);">Nouveau mot de passe</h1>
        <p class="text-secondary small mb-0">Ce lien est à usage unique et expire après 1 heure.</p>
      </div>
      <form method="post" data-mf-guard>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold">Nouveau mot de passe</label>
          <input type="password" class="form-control" id="password" name="password"
                 data-mf-password="new" autocomplete="new-password"
                 minlength="{{ PASSWORD_MIN_LENGTH }}" maxlength="{{ PASSWORD_MAX_LENGTH }}" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password_confirm" class="form-label small fw-semibold">Confirmer le mot de passe</label>
          <input type="password" class="form-control" id="password_confirm" name="password_confirm"
                 data-mf-password="current" data-mf-confirm="password" autocomplete="new-password"
                 maxlength="{{ PASSWORD_MAX_LENGTH }}" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Réinitialiser le mot de passe</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
