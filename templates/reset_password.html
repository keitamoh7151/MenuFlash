{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe — MenuFlash Mini{% endblock %}
{% block content %}
<div class="mf-auth-bg">
  <div class="card mf-auth-card p-2">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill" style="font-size: 1.8rem; color: var(--mf-accent);"></i>
        <h1 class="h5 fw-bold mt-2 mb-1" style="color: var(--mf-ink);">Nouveau mot de passe</h1>
        <p class="text-secondary small mb-0">Ce lien est à usage unique et expire après 1 heure.</p>
      </div>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" name="password" minlength="8" placeholder="Nouveau mot de passe" required>
          <label for="password">Nouveau mot de passe (8 caractères min.)</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="password_confirm" name="password_confirm" minlength="8" placeholder="Confirmer" required>
          <label for="password_confirm">Confirmer le mot de passe</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Réinitialiser le mot de passe</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
